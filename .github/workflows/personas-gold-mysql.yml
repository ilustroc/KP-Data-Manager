name: PERSONAS Gold MySQL integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-integration:
    name: MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '5.7']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install ETL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r etl/requirements.txt

      - name: Run PERSONAS Gold migration integration
        working-directory: etl
        env:
          MYSQL_IMAGE: mysql:${{ matrix.mysql }}
          PYTHON_BIN: python
        run: ./scripts/run_search_personas_gold_mysql_integration.sh

      - name: Verify TELEFONOS UPSERT regression coverage
        working-directory: etl
        env:
          MYSQL_IMAGE: mysql:${{ matrix.mysql }}
          PYTHON_BIN: python
        run: ./scripts/run_search_telefonos_mysql_integration.sh

      - name: Verify ESSALUD regression coverage
        working-directory: etl
        env:
          MYSQL_IMAGE: mysql:${{ matrix.mysql }}
          PYTHON_BIN: python
        run: ./scripts/run_search_essalud_mysql_integration.sh
